name: Build Windows portable client

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag to release (leave empty to build only)'
        required: false
        type: string
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Validate requested version tag
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+(\.[0-9]+){1,2}$') {
            throw 'Use a version tag such as v0.4 or v0.4.1.'
          }

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile client
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/classes, out/input, out/portable | Out-Null
          javac -encoding UTF-8 -d out/classes src/common/*.java src/client/*.java src/server/*.java
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create client JAR
        shell: pwsh
        run: jar --create --file out/input/client.jar --main-class client.ChatWindow -C out/classes client -C out/classes server -C out/classes common -C resources buttons

      - name: Test temporary user identities
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/test-classes | Out-Null
          javac -encoding UTF-8 -cp out/classes -d out/test-classes tests/IdentityRegression.java tests/ClientCommandRegression.java
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          java -cp "out/classes;out/test-classes" IdentityRegression
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          java -cp "out/classes;out/test-classes" ClientCommandRegression
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create portable application
        shell: pwsh
        run: >-
          jpackage --type app-image --name LanChatClient
          --input out/input --main-jar client.jar --main-class client.ChatWindow
          --dest out/portable --add-modules java.desktop

      - name: Verify package files
        shell: pwsh
        run: |
          $requiredFiles = @(
            'out/portable/LanChatClient/LanChatClient.exe',
            'out/portable/LanChatClient/app/client.jar',
            'out/portable/LanChatClient/runtime/bin/server/jvm.dll'
          )
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Missing package file: $file"
            }
          }

      - name: Upload portable client
        uses: actions/upload-artifact@v4
        with:
          name: LanChatClient-Windows-x64
          path: out/portable/LanChatClient/
          if-no-files-found: error

      - name: Create release archive
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        shell: pwsh
        run: Compress-Archive -Path out/portable/LanChatClient/* -DestinationPath out/LanChatClient-Windows-x64.zip

      - name: Publish GitHub release
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh release create $env:RELEASE_TAG out/LanChatClient-Windows-x64.zip --verify-tag --title $env:RELEASE_TAG --notes "Windows portable client for $env:RELEASE_TAG."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
